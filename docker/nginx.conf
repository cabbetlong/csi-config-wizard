# 华为 CSI 配置向导 - Nginx 站点配置（替换镜像默认 default.conf）
#
# 关键考虑：
# 1. 应用构建为纯静态目录（单文件 index.html + config/），无客户端路由，
#    try_files 兜底目录请求。
# 2. config/ 在运行时被 fetch 加载 —— 禁用强缓存，保证"改 YAML 刷新即生效"
#    （这是项目"配置与代码分离、改配置不重建"的核心工作方式）。
# 3. 首页不缓存，镜像重建后刷新立即可见。
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/html text/plain text/css application/javascript application/json image/svg+xml;

    # 目录/兜底请求 → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 首页不缓存
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 配置目录运行时加载：禁用强缓存
    location /config/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 构建产物内静态资源（viteSingleFile 下基本无 /assets，保留以兼容后续拆分）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}