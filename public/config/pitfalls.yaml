# 部署自检清单（Q12③）：文档里那些"照抄还出错"的隐藏规则。
# when 不满足时该条不适用；每条为提示性检查项（客户照单核对）。
# 新增防错条目 = 在此加数据，无需改代码。
pitfalls:
  - id: backend-name
    artifact: backend
    text_zh: 后端名称必须为小写字母/数字/中划线，≤63 字符，且全局唯一（向导已按此规则校验）
    text_en: Backend name must be lowercase letters/digits/hyphens, ≤63 chars, globally unique (validated by the wizard)
  - id: backend-namespace
    artifact: backend
    text_zh: 后端 namespace 必须等于 CSI 运行命名空间（默认 huawei-csi，向导自动保持一致）
    text_en: Backend namespace must equal the CSI namespace (default huawei-csi; kept in sync automatically)
  - id: portals-forbidden
    artifact: backend
    when: {field: backend.protocol, in: [fc, fc-nvme, dpc]}
    text_zh: FC / FC-NVMe / DPC 协议禁止填写 portals
    text_en: Do NOT configure portals for FC / FC-NVMe / DPC protocols
  - id: portals-nfs-one
    artifact: backend
    when: {field: backend.protocol, in: [nfs, nfs+]}
    text_zh: NFS / NFS+ 协议仅支持一个 portal
    text_en: NFS / NFS+ supports exactly one portal
  - id: oceanctl-interactive
    artifact: backend
    text_zh: oceanctl 创建后端时会交互式询问存储账号密码（凭据存入 K8s Secret，不写在 YAML 里）
    text_en: oceanctl prompts interactively for the storage account password (stored as a K8s Secret, not in the YAML)
  - id: provisioner-match
    artifact: storageclass
    text_zh: StorageClass 的 provisioner 必须等于 Step1 的 driverName（向导已自动保持一致）
    text_en: provisioner must equal the Step 1 driverName (kept in sync automatically)
  - id: volume-type-fixed
    artifact: storageclass
    text_zh: volumeType 由业务类型固定（块=lun / 文件=fs / dtree=dtree），向导自动填好，不要手工修改
    text_en: volumeType is fixed by service type (lun/fs/dtree) and set automatically - do not hand-edit
  - id: dorado-thick
    artifact: storageclass
    when: {state: familyId, eq: flash}
    text_zh: OceanStor Dorado 不支持 thick 分配类型
    text_en: thick allocation is not supported on OceanStor Dorado
  - id: auth-client-required
    artifact: storageclass
    when: {state: serviceType, in: [file, dtree]}
    text_zh: 文件服务 StorageClass 必须填写 authClient（向导默认 *）
    text_en: File-service StorageClass must set authClient (defaults to *)
  - id: ext4-limit
    artifact: pvc
    when: {field: sc.fsType, eq: ext4}
    text_zh: ext4 单卷上限 50Ti，容量更大时请改用 xfs
    text_en: ext4 caps at 50Ti per volume; use xfs for larger capacities
  - id: capacity-unit
    artifact: pvc
    text_zh: 容量必须带 Mi/Gi/Ti 单位（如 100Gi）
    text_en: Capacity must end with Mi/Gi/Ti (e.g. 100Gi)
  - id: cce-install-mode
    artifact: helm
    when: {state: platform, eq: cce}
    text_zh: CCE 平台通过 helm package 打包后上传控制台安装，不走 helm install
    text_en: On CCE, package with helm package and upload to the console instead of helm install
  - id: openshift-scc
    artifact: helm
    when: {state: platform, eq: openshift}
    text_zh: OpenShift 安装前需先创建 SCC（oc create -f helm_scc.yaml）
    text_en: OpenShift requires creating the SCC first (oc create -f helm_scc.yaml)
