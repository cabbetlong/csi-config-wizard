commands:
  - text_zh: 创建后端（oceanctl 会交互式询问存储账号密码，凭据存入 K8s Secret）
    text_en: Create the backend (oceanctl prompts for the storage account password, stored as a K8s Secret)
    code: |
      oceanctl create backend -f {{backend.name}}.yaml -i yaml
      oceanctl get backend {{backend.name}} -n {{helm.namespace}}   # 状态为 Bound 即成功
