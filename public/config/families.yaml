# 产品系列 × 业务类型 × 协议矩阵（Q17=B：先问产品系列）。
# 事实来源：css-docs v4.12.0 兼容性与特性矩阵。
# 新增系列/业务类型/协议 = 在此加数据，无需改代码。
families:
  - id: flash
    label_zh: 闪存存储（OceanStor Dorado / V5 / V6+）
    label_en: Flash Storage (OceanStor Dorado / V5 / V6+)
    serviceTypes:
      block:
        label_zh: 块服务
        label_en: Block Service
        storage: oceanstor-san
        volumeType: lun
        defaultProtocol: iscsi
        protocols: [fc, iscsi, nvme-roce, nvme-fc, nvme-tcp]
      file:
        label_zh: 文件服务
        label_en: File Service
        storage: oceanstor-nas
        volumeType: fs
        defaultProtocol: nfs
        protocols: [nfs, nfs+]
      dtree:
        label_zh: 文件系统（Dtree）
        label_en: File System (Dtree)
        storage: oceanstor-dtree
        volumeType: dtree
        defaultProtocol: nfs
        protocols: [nfs, nfs+]

  - id: pacific
    label_zh: 海量存储（OceanStor Pacific / FusionStorage）
    label_en: Mass Storage (OceanStor Pacific / FusionStorage)
    serviceTypes:
      block:
        label_zh: 块服务
        label_en: Block Service
        storage: fusionstorage-san
        volumeType: lun
        defaultProtocol: iscsi
        protocols: [iscsi, scsi]
      file:
        label_zh: 文件服务
        label_en: File Service
        storage: fusionstorage-nas
        volumeType: fs
        defaultProtocol: nfs
        protocols: [nfs, dpc]
      dtree:
        label_zh: 文件系统（Dtree）
        label_en: File System (Dtree)
        storage: fusionstorage-dtree
        volumeType: dtree
        defaultProtocol: nfs
        protocols: [nfs, dpc]

  - id: oceandisk
    label_zh: 海量存储（OceanDisk 系列）
    label_en: Mass Storage (OceanDisk Series)
    serviceTypes:
      block:
        label_zh: 块服务
        label_en: Block Service
        storage: oceandisk-san
        volumeType: lun
        defaultProtocol: iscsi
        protocols: [fc, iscsi, nvme-roce]
